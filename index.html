<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영문 이름 종합 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 입력 폼 박스 -->
    <div class="bg-white shadow-md rounded-lg p-5 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-4 text-gray-800">영문 이름 제출</h1>
        
        <form id="nameForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">한글 이름</label>
                <input type="text" id="koreanName" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="예: 홍길동">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">영문 이름 (이름 성 순서)</label>
                <input type="text" id="englishName" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="예: HONG GILDONG">
            </div>
            <button type="submit"
                class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200 font-medium">
                제출하기
            </button>
        </form>

        <div id="statusMessage" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <!-- 제출된 명단 박스 -->
    <div class="bg-white shadow-md rounded-lg p-5 w-full max-w-md mt-6">
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-lg font-bold text-gray-800">제출된 명단 (<span id="count">0</span>명)</h2>
            <!-- 엑셀 다운로드 버튼 (관리자 전용) -->
            <button id="downloadBtn"
                class="text-xs bg-green-600 text-white px-3 py-1.5 rounded hover:bg-green-700 transition font-medium">
                엑셀로 다운로드
            </button>
        </div>
        <div class="max-h-60 overflow-y-auto border border-gray-200 rounded-md p-2">
            <ul id="nameList" class="space-y-1 text-sm text-gray-600">
                <!-- 데이터가 실시간으로 이곳에 표시됩니다 -->
            </ul>
        </div>
    </div>

    <!-- Firebase SDK 및 연동 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 파이어베이스 데이터베이스 설정
        const firebaseConfig = {
            apiKey: "AIzaSyDVr7J84I5ZIxon8cChL-VdWdtzwmlrQl3",
            authDomain: "name-collector-fbf83.firebaseapp.com",
            databaseURL: "https://name-collector-fbf83-default-rtdb.firebaseio.com",
            projectId: "name-collector-fbf83",
            storageBucket: "name-collector-fbf83.appspot.com",
            messagingSenderId: "487664795859",
            appId: "1:487664795859:web:6040a2e688d5e1e5d7f433",
            measurementId: "G-72N29E9V5"
        };

        // 파이어베이스 초기화
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const form = document.getElementById('nameForm');
        const statusMessage = document.getElementById('statusMessage');
        const nameList = document.getElementById('nameList');
        const countSpan = document.getElementById('count');
        const downloadBtn = document.getElementById('downloadBtn');

        let allData = {}; // 다운로드를 위해 데이터를 전역으로 저장

        // 데이터 제출 이벤트 리스너
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const korean = document.getElementById('koreanName').value.trim();
            const english = document.getElementById('englishName').value.trim();

            const nameRef = ref(db, 'names');
            push(nameRef, {
                koreanName: korean,
                englishName: english,
                timestamp: Date.now()
            }).then(() => {
                statusMessage.textContent = "성공적으로 제출되었습니다!";
                statusMessage.className = "mt-4 text-center text-sm font-medium text-green-600";
                form.reset();
                setTimeout(() => { statusMessage.textContent = ""; }, 3000);
            }).catch((error) => {
                statusMessage.textContent = "제출 실패: " + error.message;
                statusMessage.className = "mt-4 text-center text-sm font-medium text-red-600";
            });
        });

        // 실시간 데이터 목록 불러오기 및 관리자 삭제 기능 연동
        const namesRef = ref(db, 'names');
        onValue(namesRef, (snapshot) => {
            nameList.innerHTML = '';
            let count = 0;
            allData = {}; // 데이터 초기화 후 갱신

            if (snapshot.exists()) {
                allData = snapshot.val();
                Object.keys(allData).forEach((key) => {
                    const item = allData[key];
                    count++;

                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center bg-gray-50 px-3 py-2 rounded border border-gray-100";
                    
                    const textSpan = document.createElement('span');
                    textSpan.textContent = `${count}. ${item.koreanName} (${item.englishName})`;
                    
                    // 관리자 삭제 버튼 생성
                    const deleteBtn = document.createElement('button');
                    deleteBtn.textContent = "삭제";
                    deleteBtn.className = "text-xs bg-red-100 text-red-600 px-2 py-1 rounded hover:bg-red-200 transition";
                    
                    deleteBtn.onclick = () => {
                        const password = prompt("관리자 비밀번호를 입력하세요:");
                        if (password === "0000") {
                            remove(ref(db, `names/${key}`))
                                .then(() => {
                                    alert("삭제되었습니다.");
                                })
                                .catch((error) => {
                                    alert("삭제 실패: " + error.message);
                                });
                        } else if (password !== null) {
                            alert("비밀번호가 틀렸습니다.");
                        }
                    };

                    li.appendChild(textSpan);
                    li.appendChild(deleteBtn);
                    nameList.appendChild(li);
                });
            } else {
                nameList.innerHTML = '<li class="text-center text-gray-400 py-2">제출된 이름이 없습니다.</li>';
            }
            countSpan.textContent = count;
        });

        // 엑셀 다운로드 (비밀번호 보호)
        downloadBtn.onclick = () => {
            const password = prompt("관리자 비밀번호를 입력하세요:");
            if (password === "0000") {
                if (Object.keys(allData).length === 0) {
                    alert("다운로드할 데이터가 없습니다.");
                    return;
                }

                // CSV 형식으로 데이터 변환 (엑셀에서 바로 열림)
                let csvContent = "\uFEFFno,koreanName,englishName\n"; // 한글 깨짐 방지 BOM 추가
                let index = 1;
                Object.keys(allData).forEach((key) => {
                    const item = allData[key];
                    csvContent += `${index},"${item.koreanName}","${item.englishName}"\n`;
                    index++;
                });

                // 파일 다운로드 실행
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'names_list.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } else if (password !== null) {
                alert("비밀번호가 틀렸습니다.");
            }
        };
    </script>
</body>
</html>
